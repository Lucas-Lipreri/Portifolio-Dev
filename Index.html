<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portifolio-Dev</title>

    <link rel="stylesheet" href="style/index.css" />

    <link
        href="https://fonts.googleapis.com/css2?family=Asap:ital,wght@0,100..900;1,100..900&family=Inconsolata:wght@200..900&family=Maven+Pro:wght@400..900&display=swap"
        rel="stylesheet" />
</head>

<body>
    <section id="header">
        <div class="background header-background"></div>
        <div class="intro">
            <div id="avatar">
                <div id="photo">
                    <img src="/style/assets/avatar/Image.png" alt="" />
                    <img id="icon" src="/style/assets/icon/CodeIcon.svg" alt="" />
                </div>
            </div>
            <div id="info-title">
                <h2>
                    Hello World! Meu nome é
                    <span class="color-red">Martina Santos</span>
                    e sou
                </h2>
                <h1>Desenvolvedora Fullstack</h1>
            </div>
            <figure id="tags">
                <fugurecaption>
                    <img src="/style/assets/tech/GitHub.svg" alt="Github logo" />
                    GitHub
                </fugurecaption>
                <fugurecaption>
                    <img src="/style/assets/tech/HTML.svg" alt="HTML logo" />
                    HTML
                </fugurecaption>
                <fugurecaption>
                    <img src="/style/assets/tech/CSS.svg" alt="CSS logo" />
                    CSS
                </fugurecaption>
                <fugurecaption>
                    <img src="/style/assets/tech/JavaScript.svg" alt="JavaScript logo" />
                    JavaScript
                </fugurecaption>
                <fugurecaption>
                    <img src="/style/assets/tech/React.svg" alt="React Logo" />
                    React
                </fugurecaption>
                <fugurecaption>
                    <img src="/style/assets/tech/Node.js.svg" alt="Node logo" />
                    Node.js
                </fugurecaption>
            </figure>
        </div>
        <div id="next-page">
            <img src="style/assets/icon/CaretDoubleDown.svg" alt="">
        </div>
    </section>
    <section id="projects">
    </section>

    <section id="services">
    </section>

    <section id="contact">
    </section>
</body>

</html>
